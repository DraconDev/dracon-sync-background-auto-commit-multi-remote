# CHANGED 2026-06-16 (goal 87c1bf4d):
# force_push_when_behind = true enables the daemon's
# existing --force-with-lease mechanism when gitlab
# is purely behind local. This prevents PUSH_STUCK
# states when network latency causes concurrent
# multi-remote pushes to race (gitlab and codeberg
# get a commit while origin/github get a different
# one). The --force-with-lease flag is SAFE: it
# aborts if the remote has commits local doesn't
# know about (i.e. someone else pushed). The
# operator is the sole author on these repos, so
# this is acceptable.
force_push_when_behind = true

