# Skip staging files larger than 100 MiB during auto-commit (operator's stated
# threshold). Note: this is the code default in policy.rs; operator's old config
# had it at 50 MiB. Restored to 100 MiB per the new policy.
max_stage_file_bytes = 104857600

# Auto-gc garbage threshold. CHANGED 2026-10-26 after the root disk hit 100%:
# ai-auto-writer/.git had accumulated 33 GiB of orphaned tmp_pack_* files
# (11 files, 3-4.4 GiB each) from interrupted/parallel gc+repack runs, and
# dracon/conv-work held another ~4.6 GiB. `git count-objects -v` reports
# tmp_pack/tmp_idx bytes under size-garbage, so this knob DOES see that class —
# but the 2 GiB code default was too high: by the time it fires the daemon's
# own gc needs headroom to run, and a 100%-full disk gives it none. The garbage
# had therefore to be reclaimed by hand. 512 MiB triggers gc while there is
# still room for it to complete, and the 1-hour per-repo cooldown in
# maybe_auto_gc keeps that bounded. 0 would disable the self-heal entirely.
auto_gc_garbage_threshold_bytes = 536870912

# Override the default untracked_exclude_patterns. CHANGED 2026-06-17:
# the operator's position is "global default = commit everything untracked,
# unless putting it in the repo would be very wrong". The previous list
# (scratch/, tmp/, pi-tmp/, .demon/, .sisyphus/, .ralph/) conflated
# "short-lived" with "very wrong to commit". They are not the same thing.
#
# Short-lived files are valid git content: the user/agent can `rm` them
# from the working tree when they're done, and the daemon will commit the
# deletion. If the user wants to recover, the file is in git history.
#
# Things that ARE very wrong to commit (handled elsewhere, NOT here):
#   - Secrets in plaintext  → warden owns the encryption flow
#   - Files > 100 MiB        → max_stage_file_bytes = 104857600
#   - Build artifacts (node_modules/, target/, build/, dist/) → gitignore
#
# This is a global rule. Per-repo overrides are reserved for cases where
# a specific repo needs to opt back into excluding something (e.g. an
# operator-owned repo with a different convention).
#
# Historical context: the previous 11 patterns were added in goals
# 9aaf0b08 and 546d4f9c as "super-good reasons to keep untracked". The
# 2026-06-17 reframe is that short-lived ≠ very-wrong-to-commit, so
# none of them qualify anymore.
untracked_exclude_patterns = []

# --- SECTION 7: STANDARD FILES ---
# AGPL v3 LICENSE auto-copied to every repo. Never overwrites existing files.
# FUNDING.yml is the GitHub Sponsors / community funding configuration; it
# must live at .github/FUNDING.yml for GitHub to discover it. This is a
# Dracon-specific opt-in, not a generic dracon-sync default for external users.
# The default template ships with no funding destinations so a freshly-scaffolded
# repo advertises nothing until the operator fills it in.
# Long form is used because GitHub requires the .github/ subdir for FUNDING.yml
# and the deserializer only accepts a single array shape (all short or all long).
# CHANGED 2026-07-22 (audit M20/F3.2 cleanup): moved ABOVE the
# [[standard_files]] blocks — TOML silently absorbs trailing bare keys
# into the last table entry, so this field was being ignored (harmless
# while it matched the default, but a trap the day it changed).
standard_files_auto = true  # Auto-copy ensures new repos always get these

[[standard_files]]
source = "templates/LICENSE"
target = "LICENSE"
overwrite = false

[[standard_files]]
source = "templates/FUNDING.yml"
target = ".github/FUNDING.yml"
overwrite = false

# Per-repo name mapping for platforms that reject dots (GitLab, Codeberg).
# Maps local directory name → remote project name.

# --- SECTION 5: EXTRA REMOTES ---
# DELETED 2026-07-22 (audit M20/F3.2 cleanup): the [extra_remotes] table
# mapped to no SyncPolicy field and was silently dropped by the parser.
# If extra remotes are ever needed, that is a real feature (serde field +
# tests), not a zombie section.

# --- SECTION 6: MIRROR REMOTES ---
# These remotes are pushed to in addition to origin on every sync cycle.
# The {repo} placeholder is replaced with the repo directory name.

[[remotes]]
name = "github"
push_url = "git@github.com:DraconDev/{repo}.git"
auto_create = true  # Auto-create GitHub private repos for new repos

