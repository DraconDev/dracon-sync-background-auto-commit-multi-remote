# 2026-10-11 (hellhunter audit pass, USER DECISION: "make the art durable").
#
# That pass set build_artifact_cleanup = false to keep the art tracked, at the
# cost of disabling the build-artifact net for all 34 watched repos. The
# queue item ".pi-glla/goals/20261011163341-ypwzqd.md" closed the loop on
# 2026-10-11: the directory was renamed from static/art/generated/ to
# static/art/shipped/ — `shipped` is not in the daemon's hardcoded list
# (".output" | ".out" | "output" | "generated" | "gen" | ".next" | "dist-new"
# | .output* | *_output | output-*, see draco-sync-0.113.77/src/exclude.rs:1714),
