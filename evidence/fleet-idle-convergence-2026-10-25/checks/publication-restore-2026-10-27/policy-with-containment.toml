### 📡 SECTION 2: THE RHYTHM (Sync Logic)
# How often (seconds) to scan repos for activity while daemon is running.
pulse_interval_secs = 1
# Push only after this many quiet seconds since last detected repo change.
# CHANGED 2026-06-16 (goal 114541e6): 5 -> 3. With AI agents working in
# the same repo, the 5s window was chaining unrelated changes into a
# single commit. The 3s debounce produces more granular commits with
# CHANGED 2026-06-20: 5 -> 2 (tighter settle to avoid mixing unrelated
# edits from different game/API projects in the same commit while still
# batching rapid edits on the same file).
inactivity_push_delay_secs = 2
# CHANGED 2026-06-20 (goal 38142891-839f-4569-b566-3ace1d5be354): 100000 -> 100.
# Previous value (100000) was too high: the daemon committed 50-100
# file batches in one go, which made individual commits too large to
# review and caused several large-push timeouts in the prior week.
# The 100-file batch limit keeps individual commits reviewable and
# matches the AGENTS.md audit that originally recommended this value.
# The 100-file limit is per-cycle; multiple cycles may be needed for
# a single 200+ file batch, but the daemon settles between cycles so
# the result is still 1-2 commits per batch, not 5+ like the 1s/100k
# configuration produced.
max_stage_batch_files = 100


# [auto_commit] - Automatically stage and commit local changes.
auto_commit = true
# If true, bump patch versions before auto-commits (best-effort).
# Applies when these files exist at repo root:
# - Rust: Cargo.toml (+ keep Cargo.lock aligned for root package)
# - Node/TS: package.json (+ align package-lock.json root version when applicable)
# - Generic: VERSION
auto_bump_versions = true
# [auto_pull]   - Rebase and autostash remote changes before committing.
auto_pull = true
# [auto_push]   - Propagate local commits to all configured remotes.
# Temporary security containment, 2026-10-27: investigate published plaintext env blobs.
# Restore only after fail-closed publication is qualified; private original saved in
# ~/.local/state/dracon-sync/security-incident-20261027T145429Z/.
auto_push = false
# [auto_github_private] - Auto-create GitHub origin remote for repos without one.
auto_github_private = false
auto_github_private_account = "DraconDev"
# [auto_repair_concerns] - Run concern repair logic after each sync pass.
auto_repair_concerns = true
# [auto_repair_warns] - Run dirty-only warn triage after each sync pass.
auto_repair_warns = true
# [auto_rewrite_large_blobs] - Aggressive rewrite when large blobs are detected.
# Keep false for safe default behavior.
# CHANGED 2026-08-30: true -> false — true was reverting the F4
# Object.values(LEGACY_KEYS) derivation 4× (3dd0634f/21e4d685/a1495554/
# dcd7646f; getter workaround c0f0e39 also reverted as fd1c8ed) — the
# heuristic treats a 1-line derivation as blob-like. Stable fix is
# b8eeaf23 DB-only (no LEGACY_KEYS at all). Disable globally per
# the inline warning.
auto_rewrite_large_blobs = false

# Git operation idle timeouts (seconds). Push/pull commands are progress-aware:
# stalled operations are killed after this idle window, while active pack
# transfer progress extends the deadline so large repos are not aborted early.
pull_op_timeout_secs = 30
# CHANGED 2026-06-17 (push-timeout-fix-2026-06-17): 60 -> 300.
# The v0.112.10 release surfaced this limit: a 23-file commit in
# `dracon-platform` (mostly game-dev smoke-out PNG binaries) timed out
# at 60s to gitlab and codeberg, triggering PUSH_STUCK. Recovery
# required a manual `timeout 300 git push --no-verify` to clear.
# 300s matches the daemon's own code default (`default_push_op_timeout_secs`
# in dracon-sync/src/policy.rs) and gives a ~5x safety margin over the
# measured >60s push time for the 23-file PNG commit. Per-remote
# timeouts (e.g. 60s for github, 300s for gitlab/codeberg) would be
# more precise but require a daemon code change (deferred to a
# follow-up daemon release). For now, the single global 300s is
# wasteful for github (which never takes more than a few seconds) but
# harmless — the daemon times out via process kill, not via waiting.
# See docs/design/push-timeout-fix-2026-06-17.md for the full data,
# rationale, and runbook.
#
# CHANGED 2026-06-23 (goal mqqsyzyd-qkvna5): 300 -> 900.
# A 50-commit + 5000+ file push in `dracon-platform` (mostly game-dev
# smoke-out PNGs + darklord audit batches) kept timing out at 300s
# to gitlab, causing 7+ consecutive PUSH_STUCK failures over 2 hours.
# Investigation (see docs/design/gitlab-storage-and-divergence-2026-06-23.md
# UPDATE 2026-06-23 16:35 BST section) showed the push WOULD succeed
# given more time — gitlab returned "fast-forward" on --dry-run, and
# the 300s timeout was the only blocker. Bumping to 900s (15 min) gives
# ~3x the previous safety margin. Per-remote timeout is still deferred
# (daemon code change). The 900s is global; github pushes still finish
# in <5s so the waste is minimal. After the platform backlog drains,
# this can be tuned back down.
# NOTE 2026-10-22 (vidpro channel-facts-line work) — no value change.
# While unblocking `browser-extensions-shared`, the push was investigated to
# the bottom and this timeout was RULED OUT as the cause. Measurements:
#   - The daemon scales this base by the commit count (`scale_push_timeout`:
#     4x for 21-50 commits ahead). At base 900s and 37 commits ahead the
#     effective window was 900 x 4 = 3600s (60 min).
#   - The pre-push gate (`scripts/git-hooks/pre-push`) derives its affected
#     workspaces from the PUSHED RANGE and runs typecheck + build + test +
#     lint for each. Measured end to end in the daemon's own run: 19m 50s
#     for 9 extensions (36 gate logs), all green. 20 min fits inside 60 min.
#   - `git push --dry-run` of the same range succeeds instantly and both
#     remotes answer `git ls-remote`.
# So the window was never the blocker, and the base was left at 900s.
# The GitHub leg is skipped by the daemon's own 2 GiB guard: this repo's
# pack is 2.73 GiB, and `github_pack_too_large` makes the daemon skip the
# GitHub push and record "skipped: pushable branch exceeds github's 2 GiB
# pack limit" — which surfaces as a PUSH FAIL in `dracon-sync repos`.
# The daemon's own remedy is a history rewrite or an OVH asset migration.
push_op_timeout_secs = 900
# CHANGED 2026-06-23 (goal mqqsyzyd-qkvna5): 120 -> 960.
# The 2026-06-17 health-warning threshold (push/pull timeout + 30s
# safety margin) was 330s. With push_op_timeout_secs now at 900s,
# repo_sync_timeout_secs needs to be > 900+30 = 930s to avoid the
# health warning. 960s gives 30s margin over the 900s push timeout.
# Normal repos still finish in <10s so the waste is minimal; only
# platform's 50-commit + 5000-file push needs the full window.
# Daemon's policy validator will re-validate on next cycle.
repo_sync_timeout_secs = 960
# Retry count for push operations before fallback transport logic.
push_retries = 3
# Cooldown between failed auto-repair attempts on the same repo.
repair_cooldown_secs = 60
# Hard push guardrail for blob size; keep <= 100 MiB host limit.
max_push_blob_bytes = 52428800
# Incident ledger retention policy.
incident_ledger_max_lines = 10000
incident_ledger_max_age_days = 30

# CHANGED 2026-06-26 (goal mqu95usq-hbt73a): 10 -> 50.
# Platform's PUSH_STUCK divergence (now ~889 ahead / 20 behind, growing
# ~1 commit / 30s, pre-existing from goal mqqsyzyd-qkvna5) was causing
# the daemon to emit ALERT journal entries every ~30s while the count
# grew from 10 -> 11 -> 12 -> ... -> 889. With threshold=10, the daemon
# fired 100+ ALERTs in 2h; with threshold=50, alerts only fire when
# the divergence crosses 50, 100, 150, ... (i.e. every ~25 min instead
# of every ~30s). This is the FIRST of three spam-reduction changes
# (the other two are in ~/.dracon/sync-notify/sync-notify.sh: longer
# throttle and de-duplication while the same condition persists).
# Per the goal's Boundaries: the daemon config is NOT a daemon code
# change (the field already exists in policy.rs at line 510-511, default
# value at line 970-972). No rebuild needed; daemon restart picks up
# the new value.
alert_unpushed_threshold = 50

# Mirror visibility & metadata sync from GitHub origin
sync_visibility = true
sync_metadata = true
sync_visibility_interval_hours = 24

### 🔒 SECTION 3: THE VAULT (Backup Strategy)
# 'Bundle' creates air-gapped git-bundle files in the backup_dir before every
# sync attempt. This is your insurance against failed rebases or data loss.
backup_policy = "Bundle"
backup_dir = "/home/dracon/dracon/backups"

# v0.113.10 (2026-07-29): opt-in stale daemon-branch janitor. Daily per-repo
# pass bundles `backup/pre-sync-largeblob-fix-*` + `daemon-standalone`
# branches and orphaned refs/remotes/<removed-remote>/* tracking refs into
# backup_dir/auto-prune/, verifies the bundle, deletes locally, and deletes
# remote copies whose tips match. Enabled after the 2026-07-29 manual fleet
# cleanup proved the flow (docs/design/stale-backup-branch-cleanup-2026-07-29.md).
auto_prune_stale_backup_branches = true

