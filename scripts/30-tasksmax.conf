# 30-tasksmax.conf — raise the operator daemon's task ceiling from 96 to 512.
#
# Why: the daemon's systemd unit was generated on 2026-10-19 with TasksMax=96.
# The shipped unit (dracon-sync.service), the NixOS operator module
# (scripts/dracon-sync-operator.nix) and the parent flake's parity check all
# carry 512, because the daemon's own Git filters and Node pre-push workers
# are the consumers that hit the ceiling. The live unit kept the old limit,
# so the daemon could be throttled into "Task limit exceeded" while its
# sources said otherwise.
#
# Install (needs root):
#   sudo install -m 644 scripts/30-tasksmax.conf \
#     /run/systemd/system/dracon-sync-operator.service.d/30-tasksmax.conf
#   sudo systemctl daemon-reload
#
# The limit takes effect for the running service after the next start; the
# daemon handles SIGTERM gracefully and the unit has Restart=always, so a
# graceful restart is enough and `systemctl stop` is not required.
#
# Verify:
#   systemctl show dracon-sync-operator.service -p TasksMax   # -> 512
[Service]
TasksMax=512
