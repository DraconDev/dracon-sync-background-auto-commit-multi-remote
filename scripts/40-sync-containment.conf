# 40-sync-containment.conf — hard containment for the dracon-sync daemon.
#
# WHY (2026-11-11 memory-collapse incident)
#   The sync daemon collapsed the host. Measured during the incident:
#     - cgroup memory: 1.4 GiB resident + 1.2 GiB swap (3.4 GiB swap peak)
#       with systemd reporting "available: 15.9M" — pinned at MemoryHigh,
#       so the kernel was in global reclaim continuously.
#     - 4.6 TB read / 1 TB written and 23 h of CPU, because a hung
#       `git push` kept repos in-flight and the daemon re-classified all
#       38 repos on a loop, scaling push timeouts 900s -> 5400s.
#     - The host reached 182 MiB free RAM with ~1.6 GB/s of swap traffic.
#       The desktop died: KWin's amdgpu pageflip path timed out once per
#       second for 10.5 minutes ("Pageflip timed out! This is a bug in the
#       amdgpu kernel driver"), the screens blacked out, and every window
#       stopped repainting while the apps underneath stayed alive.
#
#   The memory guard (dracon-system) could only renice and set oom_score_adj
#   on the offenders. A git-churning daemon ignores both. The daemon was
#   also invisible to it: its footprint was mostly SWAPPED, so it never
#   ranked as a top-RSS offender.
#
#   These settings make the daemon the thing that gives way instead of the
#   desktop. systemd-oomd (already active on this host) kills this unit and
#   nothing else when the daemon becomes the memory hog; Restart=always
#   brings it back 30 s later. A restarted sync is cheap. A wedged desktop
#   is not.
#
# MemorySwapMax is the important one: on this host "swap" is 60 GiB of zram,
# i.e. RAM plus zstd CPU. 128M keeps the daemon's footprint visible in RSS
# and stops the amplification.
#
# DURABILITY
#   This file lives in /run, so it does NOT survive a reboot. The same
#   settings are declared in the NixOS module
#   (dracon-sync/scripts/dracon-sync-operator.nix), which is imported by
#   the host configuration; once that module is rebuilt in, the unit carries
#   these limits permanently and this drop-in becomes unnecessary.
#
# Install (needs root):
#   sudo install -m 644 dracon-sync/scripts/40-sync-containment.conf \
#     /run/systemd/system/dracon-sync-operator.service.d/40-sync-containment.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart dracon-sync-operator.service
#
# Verify:
#   systemctl show dracon-sync-operator.service \
#     -p MemoryHigh -p MemoryMax -p MemorySwapMax -p IOWeight \
#     -p OOMPolicy -p ManagedOOMSwap -p ManagedOOMMemoryPressure
[Service]
MemoryHigh=1024M
MemoryMax=1400M
MemorySwapMax=128M
IOWeight=10
OOMPolicy=kill
ManagedOOMMemoryPressure=kill
ManagedOOMSwap=kill
RestartSec=30
