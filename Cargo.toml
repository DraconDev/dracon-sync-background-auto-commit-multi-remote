[package]
name = "dracon-sync"
version = "0.113.53"
edition = "2021"
license = "AGPL-3.0-only"
description = "Invisible git sync daemon for deterministic AI-assisted development"
readme = "README.md"
repository = "https://github.com/DraconDev/dracon-sync-background-auto-commit-multi-remote"
homepage = "https://github.com/DraconDev/dracon-sync-background-auto-commit-multi-remote"
documentation = "https://docs.rs/dracon-sync"
keywords = ["git", "sync", "daemon", "auto-commit", "multi-remote"]
categories = ["command-line-utilities"]
exclude = [".github/", "docs/", "*.md", "!README.md", "Cargo.lock", "target/"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
comfy-table = { version = "7", features = ["custom_styling"] }
dirs = "6.0"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal", "sync"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
futures = "0.3"
toml = "0.8"
dracon-git = "94.7.2"
notify-rust = "4.17"
parking_lot = "0.12"
urlencoding = "2"
unicode-width = "0.2"
terminal_size = "0.4"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[features]
default = []

# This manifest is maintained in the standalone dracon-sync repository.
# The parent dracon-utilities workspace consumes this directory by path.
