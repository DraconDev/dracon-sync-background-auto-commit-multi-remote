[package]
name = "dracon-sync"
version = "0.113.94"
edition = "2021"
# FIXED 2026-09-27 (audit F84): the CI "Minimum Toolchain" job
# installed `stable` and therefore enforced no MSRV at all. This is the
# real floor, verified by building the whole workspace (--all-targets)
# on 1.89.0; 1.88.0 fails on notify-rust 4.18 (requires 1.89.0).
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Invisible git sync daemon for deterministic AI-assisted development"
readme = "README.md"
repository = "https://github.com/DraconDev/dracon-sync-background-auto-commit-multi-remote"
homepage = "https://github.com/DraconDev/dracon-sync-background-auto-commit-multi-remote"
documentation = "https://docs.rs/dracon-sync"
keywords = ["git", "sync", "daemon", "auto-commit", "multi-remote"]
categories = ["command-line-utilities"]
exclude = [".github/", "docs/", "*.md", "!README.md", "Cargo.lock", "target/"]

[dependencies]
tempfile = "3"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
comfy-table = { version = "7", features = ["custom_styling"] }
dirs = "6.0"
libc = "0.2"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal", "sync", "io-util"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
futures = "0.3"
globset = "0.4.20"
sha2 = "0.10.9"
hmac = "0.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
zeroize = "1.9.0"
toml = "0.8"
dracon-git = "94.7.2"
git2 = "0.21"
notify-rust = "4.17"
parking_lot = "0.12"
urlencoding = "2"
unicode-width = "0.2"
unicode-segmentation = "1"
terminal_size = "0.4"

[dev-dependencies]
proptest = "1"

[features]
default = []

# This manifest is maintained in the standalone dracon-sync repository.
# The parent dracon-utilities workspace consumes this directory by path.
